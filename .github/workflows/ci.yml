name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  package:
    name: Package / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test the packaged Skill provider
        run: node --test tests-node/*.test.js

      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import importlib.metadata; assert importlib.metadata.version('dsh-mediacrawler') == '0.1.0'"
          command -v dsh-mediacrawler-mcp

      - name: Build and inspect the DSH package
        id: pack
        run: |
          npm pack --json > npm-pack.json
          node -e "const fs=require('node:fs'),path=require('node:path'); const p=require('./npm-pack.json')[0]; const files=new Set(p.files.map(x=>x.path)); const required=['skill-provider.js','cordis.patch.yml','.dsh/skills/mediacrawler-collector/SKILL.md']; const missing=required.filter(x=>!files.has(x)); if(![...files].some(x=>/^src\/dsh_mediacrawler\/.*\.py$/.test(x))) missing.push('src/dsh_mediacrawler/*.py'); const bad=[...files].filter(x=>/__pycache__|\.pyc$|egg-info/.test(x)); if(missing.length||bad.length) throw new Error(JSON.stringify({missing,bad})); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tarball='+path.resolve(p.filename)+'\n');"

      - name: Install the bundle into a clean DSH profile
        shell: bash
        run: |
          npm install --global pnpm@11.19.0
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          npx --yes @deepseek-ai/dsh@0.1.0-rc.6 plugin --profile web add "${{ steps.pack.outputs.tarball }}"
          npx --yes @deepseek-ai/dsh@0.1.0-rc.6 --profile web --dump-config > "$RUNNER_TEMP/dsh-config.yml"
          grep -F '# == dsh-mediacrawler' "$RUNNER_TEMP/dsh-config.yml"
          grep -F 'id: skill-mediacrawler' "$RUNNER_TEMP/dsh-config.yml"
          grep -F 'id: mcp-mediacrawler' "$RUNNER_TEMP/dsh-config.yml"

      - name: Start DSH with the packaged MCP server
        shell: bash
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          export DSH_MEDIACRAWLER_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export MEDIACRAWLER_ROOT="$GITHUB_WORKSPACE/tests/fake_mediacrawler"
          export MEDIACRAWLER_PYTHON="$DSH_MEDIACRAWLER_PYTHON"
          export DSH_MEDIACRAWLER_STATE_DIR="$RUNNER_TEMP/dsh-mediacrawler-state"
          pid_file="$RUNNER_TEMP/dsh-start.pid"
          setsid --fork --wait bash -c 'echo "$$" > "$1"; shift; exec "$@"' \
            _ "$pid_file" npx --yes @deepseek-ai/dsh@0.1.0-rc.6 --profile web --port 38999 \
            > "$RUNNER_TEMP/dsh-start.log" 2>&1 &
          launcher_pid=$!
          cleanup() {
            set +e
            if test -s "$pid_file"; then
              dsh_pid="$(cat "$pid_file")"
              kill -TERM -- "-$dsh_pid" 2>/dev/null
              for _ in {1..10}; do
                kill -0 -- "-$dsh_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL -- "-$dsh_pid" 2>/dev/null
            else
              kill -TERM "$launcher_pid" 2>/dev/null
            fi
            wait "$launcher_pid" 2>/dev/null
          }
          trap cleanup EXIT
          for _ in {1..25}; do
            test -s "$pid_file" && break
            kill -0 "$launcher_pid" 2>/dev/null || break
            sleep 0.2
          done
          test -s "$pid_file"
          ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:38999/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dsh-start.log"
          test "$ready" = true
          grep -F 'dsh web: http://127.0.0.1:38999' "$RUNNER_TEMP/dsh-start.log"
