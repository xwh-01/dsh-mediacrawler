[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-mediacrawler"
version = "0.1.0"
description = "DeepSeek Harness MCP adapter for MediaCrawler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xwh-01" }]
keywords = ["deepseek-harness", "dsh-plugin", "mcp", "mediacrawler"]
dependencies = [
  "mcp>=2.0,<3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
dsh-mediacrawler-mcp = "dsh_mediacrawler.server:main"

[project.urls]
Homepage = "https://github.com/xwh-01/dsh-mediacrawler"
Repository = "https://github.com/xwh-01/dsh-mediacrawler.git"
Issues = "https://github.com/xwh-01/dsh-mediacrawler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
